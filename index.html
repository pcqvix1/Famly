<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b141a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FamlyChat - Conecte-se com sua Família</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="capacitor-setup.js"></script>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--background-default);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 1rem;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid var(--primary);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body data-theme="dark">
    <div id="splash-screen">
        <div class="spinner"></div>
        <p>Carregando...</p>
    </div>
    <div class="auth-wrapper" style="display: none;">
        <div class="auth-container">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <i class="bi bi-chat-heart-fill"></i>
                </div>
                <h1>FamlyChat</h1>
                <p>Conecte-se com quem você ama</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login">Entrar</button>
                <button class="auth-tab" id="tab-register">Criar Conta</button>
            </div>

            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" placeholder="Sua senha" required>
                </div>
                <div id="login-error" class="error-message"></div>
                <button type="submit" class="btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <form class="auth-form" id="register-form" style="display: none;">
                <div class="form-group">
                    <label for="register-name">Nome Completo</label>
                    <input type="text" id="register-name" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Senha</label>
                    <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" required
                        minlength="6">
                </div>
                <div id="register-error" class="error-message"></div>
                <button type="submit" class="btn-primary">
                    <i class="bi bi-person-plus-fill"></i> Criar Conta
                </button>
            </form>
        </div>
    </div>

    <script src="capacitor.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyANjWULYll8KXkKaofhZf-_7UdPQjp7Tf0",
            authDomain: "famly-8f61d.firebaseapp.com",
            projectId: "famly-8f61d",
            storageBucket: "famly-8f61d.firebasestorage.app",
            messagingSenderId: "977105798054",
            appId: "1:977105798054:web:31f6e74b18d6670b9cc567",
            measurementId: "G-0HHXK30GW8"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "chat.html";
            } else {
                document.getElementById('splash-screen').style.display = 'none';
                document.querySelector('.auth-wrapper').style.display = 'flex';
            }
        });

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.style.display = 'flex';
            registerForm.style.display = 'none';
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.style.display = 'flex';
            loginForm.style.display = 'none';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                errorEl.textContent = getErrorMessage(error.code);
                errorEl.classList.add('show');
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const errorEl = document.getElementById('register-error');

            if (name.trim().length < 2) {
                errorEl.textContent = "Por favor, insira seu nome completo.";
                errorEl.classList.add('show');
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                await user.updateProfile({ displayName: name });

                await db.collection("users").doc(user.email).set({
                    name: name,
                    email: user.email,
                    photoURL: null,
                    status: "Olá! Estou usando o FamlyChat",
                    contacts: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                    isOnline: true
                });

            } catch (error) {
                errorEl.textContent = getErrorMessage(error.code);
                errorEl.classList.add('show');
            }
        });

        function getErrorMessage(code) {
            const messages = {
                'auth/email-already-in-use': 'Este email já está em uso.',
                'auth/invalid-email': 'Email inválido.',
                'auth/weak-password': 'A senha deve ter pelo menos 6 caracteres.',
                'auth/user-not-found': 'Usuário não encontrado.',
                'auth/wrong-password': 'Senha incorreta.',
                'auth/too-many-requests': 'Muitas tentativas. Tente novamente mais tarde.',
                'auth/invalid-credential': 'Email ou senha incorretos.'
            };
            return messages[code] || 'Ocorreu um erro. Tente novamente.';
        }
    </script>
</body>

</html>
