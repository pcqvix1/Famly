<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat da Família - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="d-flex justify-content-center align-items-center h-100">
        <div id="auth-container" class="shadow-lg p-4 bg-white rounded">
            <h2 class="text-primary text-center mb-4">Bem-vindo ao Chat Famly</h2>
            
            <div class="mb-3">
                <input type="text" id="name" class="form-control" placeholder="Seu Nome Completo">
            </div>
            <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Seu email">
            </div>
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="Sua senha">
            </div>

            <button id="btn-login" class="btn btn-primary w-100 mb-2">Entrar</button>
            <button id="btn-register" class="btn btn-success w-100">Registar (Primeira vez)</button>
            
            <p id="error-message" class="mt-3"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
